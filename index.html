<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎬 Movie Finder</h1>

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="Search any movie..."
        >

        <button id="btn">Search</button>
    </div>

    <div class="movie-card">

        <img
            id="poster"
            src="https://placehold.co/300x450?text=Movie+Poster"
            alt="Movie Poster"
        >

        <div class="details">

            <h2 id="title">Movie Title</h2>

            <p><strong>⭐ Rating:</strong> <span id="rating">8.5</span></p>

            <p><strong>📅 Year:</strong> <span id="year">2023</span></p>

            <p><strong>🎭 Genre:</strong> <span id="genre">Action</span></p>

            <p><strong>⏱ Runtime:</strong> <span id="runtime">120 min</span></p>

            <p><strong>🎬 Director:</strong> <span id="director">John Doe</span></p>

            <p id="plot">
                Search a movie to see its description.
            </p>

        </div>

    </div>

</div>

</body>
</html>
